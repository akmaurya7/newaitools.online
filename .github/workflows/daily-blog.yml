name: Twice Daily AI Blog Generator

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install
        
      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Run AI Blog Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generate-daily-blog.ts

      - name: Regenerate Sitemaps
        run: npx tsx generate-sitemap.ts

      - name: Test Build
        run: npm run build

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new blog generated."
          else
            git commit -m "feat: auto-generated in-depth blog post"
            git push
          fi
