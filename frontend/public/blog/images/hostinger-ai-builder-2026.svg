<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">From idea to live website with Hostinger AI Builder</title>
<desc id="desc">Editorial illustration showing a natural-language prompt becoming an AI-generated responsive website, then a hosted web app with backend data and authentication.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b2a66"/><stop offset="55%" stop-color="#2847b8"/><stop offset="100%" stop-color="#7c5ce6"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e8efff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".25"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1440" cy="130" r="250" fill="#ffffff" opacity=".08"/><circle cx="130" cy="820" r="260" fill="#d86bff" opacity=".10"/>
<text x="90" y="115" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#fff">From Idea to Live Website</text>
<text x="90" y="170" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f2eaff">with Hostinger AI Builder</text>
<text x="90" y="215" font-family="Arial,sans-serif" font-size="23" fill="#dbe7ff">Describe. Generate. Connect. Review. Publish.</text>

<g filter="url(#shadow)">
  <rect x="80" y="320" width="340" height="285" rx="28" fill="#f8fbff"/>
  <text x="112" y="365" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">1. Your prompt</text>
  <rect x="112" y="395" width="275" height="135" rx="16" fill="#e8efff"/>
  <text x="135" y="430" font-family="Arial,sans-serif" font-size="17" fill="#1e3a8a">Create a booking web app</text>
  <text x="135" y="458" font-family="Arial,sans-serif" font-size="17" fill="#1e3a8a">with accounts, calendar,</text>
  <text x="135" y="486" font-family="Arial,sans-serif" font-size="17" fill="#1e3a8a">payments and email.</text>
</g>

<path d="M435 465 H485" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M470 445 L495 465 L470 485" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<g filter="url(#shadow)">
  <rect x="520" y="275" width="590" height="380" rx="30" fill="#111827"/>
  <rect x="545" y="315" width="540" height="300" rx="18" fill="url(#panel)"/>
  <rect x="575" y="350" width="220" height="22" rx="11" fill="#c7d2fe"/>
  <rect x="575" y="392" width="430" height="16" rx="8" fill="#dbe4f5"/>
  <rect x="575" y="420" width="350" height="16" rx="8" fill="#dbe4f5"/>
  <rect x="575" y="475" width="145" height="82" rx="14" fill="#c7d2fe"/>
  <rect x="740" y="475" width="145" height="82" rx="14" fill="#bfdbfe"/>
  <rect x="905" y="475" width="145" height="82" rx="14" fill="#ddd6fe"/>
  <text x="575" y="330" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">AI-generated responsive web app</text>
  <circle cx="560" cy="294" r="6" fill="#94a3b8"/><circle cx="580" cy="294" r="6" fill="#94a3b8"/><circle cx="600" cy="294" r="6" fill="#94a3b8"/>
</g>

<path d="M1125 465 H1175" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M1160 445 L1185 465 L1160 485" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<g filter="url(#shadow)">
  <rect x="1210" y="290" width="310" height="365" rx="28" fill="#f8fbff"/>
  <text x="1240" y="335" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172554">4. Review &amp; publish</text>
  <rect x="1240" y="365" width="250" height="58" rx="14" fill="#e0e7ff"/>
  <text x="1260" y="401" font-family="Arial,sans-serif" font-size="16" fill="#312e81">Database + authentication</text>
  <rect x="1240" y="440" width="250" height="58" rx="14" fill="#dbeafe"/>
  <text x="1260" y="476" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">Hosting + custom domain</text>
  <rect x="1240" y="515" width="250" height="58" rx="14" fill="#dcfce7"/>
  <text x="1260" y="551" font-family="Arial,sans-serif" font-size="16" fill="#166534">Go live when verified</text>
</g>

<text x="90" y="760" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">AI Builder = website creation + agentic app development + hosting</text>
<text x="90" y="800" font-family="Arial,sans-serif" font-size="19" fill="#dbe7ff">Editorial illustration. Not a screenshot of Hostinger's product interface.</text>
</svg>