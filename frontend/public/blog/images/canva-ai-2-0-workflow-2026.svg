<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Canva AI 2.0 conversational design workflow</title>
  <desc id="desc">An editorial illustration showing a rough design brief becoming an editable AI-assisted design, connected source material, review, and publication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="145" cy="130" r="180" fill="#38bdf8" opacity=".12" filter="url(#soft)"/>
  <circle cx="1430" cy="735" r="210" fill="#fb7185" opacity=".12" filter="url(#soft)"/>

  <g opacity=".18" fill="none" stroke="#fff">
    <path d="M80 720 C280 540 300 300 520 160"/>
    <path d="M1090 150 C1260 280 1280 510 1510 600"/>
  </g>

  <!-- rough brief -->
  <g transform="translate(90 230) rotate(-5 180 170)" filter="url(#shadow)">
    <rect width="360" height="340" rx="22" fill="#fffdf8"/>
    <rect x="28" y="28" width="100" height="12" rx="6" fill="#111827" opacity=".72"/>
    <rect x="28" y="58" width="210" height="8" rx="4" fill="#64748b" opacity=".45"/>
    <path d="M40 125 L130 72 L205 135 L275 88 L325 145 L325 255 L40 255 Z" fill="none" stroke="#334155" stroke-width="6" opacity=".55"/>
    <path d="M55 292 H190 M55 312 H250" stroke="#64748b" stroke-width="8" stroke-linecap="round" opacity=".4"/>
    <circle cx="286" cy="52" r="18" fill="#f59e0b" opacity=".25"/>
    <path d="M286 40 v24 M274 52 h24" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="455" y="170" width="650" height="430" rx="34" fill="#0b1220" stroke="#334155" stroke-width="8"/>
    <rect x="490" y="205" width="580" height="360" rx="18" fill="url(#screen)"/>
    <path d="M390 625 H1170 L1235 690 H325 Z" fill="#111827" stroke="#475569" stroke-width="6"/>
    <rect x="665" y="632" width="230" height="12" rx="6" fill="#64748b" opacity=".7"/>
  </g>

  <!-- editable design inside laptop -->
  <g transform="translate(530 245)">
    <rect width="500" height="280" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="24" y="24" width="160" height="12" rx="6" fill="#0f172a" opacity=".8"/>
    <rect x="24" y="52" width="245" height="8" rx="4" fill="#94a3b8"/>
    <rect x="24" y="92" width="270" height="140" rx="12" fill="url(#accent)" opacity=".22"/>
    <path d="M40 208 L115 135 L165 178 L220 110 L275 208 Z" fill="#4f46e5" opacity=".62"/>
    <circle cx="235" cy="126" r="22" fill="#fb7185" opacity=".65"/>
    <rect x="320" y="94" width="145" height="18" rx="9" fill="#0f172a" opacity=".82"/>
    <rect x="320" y="130" width="125" height="10" rx="5" fill="#64748b" opacity=".55"/>
    <rect x="320" y="154" width="105" height="10" rx="5" fill="#64748b" opacity=".45"/>
    <rect x="320" y="190" width="135" height="28" rx="14" fill="#4f46e5" opacity=".85"/>
    <text x="387" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="700">REFINE</text>
    <rect x="294" y="80" width="190" height="155" rx="12" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8 8"/>
    <circle cx="294" cy="80" r="7" fill="#8b5cf6"/>
    <circle cx="484" cy="80" r="7" fill="#8b5cf6"/>
    <circle cx="294" cy="235" r="7" fill="#8b5cf6"/>
    <circle cx="484" cy="235" r="7" fill="#8b5cf6"/>
  </g>

  <!-- conversational prompt -->
  <g transform="translate(650 505)" filter="url(#shadow)">
    <rect width="430" height="72" rx="36" fill="#111827" stroke="#64748b" stroke-width="2"/>
    <circle cx="38" cy="36" r="17" fill="#8b5cf6"/>
    <path d="M31 36 L36 41 L47 29" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="31" font-family="system-ui,sans-serif" font-size="15" fill="#e2e8f0">Create the campaign, then</text>
    <text x="70" y="52" font-family="system-ui,sans-serif" font-size="15" fill="#e2e8f0">keep every element editable.</text>
  </g>

  <!-- connected source cards -->
  <g filter="url(#shadow)">
    <rect x="1190" y="150" width="300" height="110" rx="20" fill="#fff" opacity=".97"/>
    <rect x="1215" y="177" width="44" height="44" rx="10" fill="#dbeafe"/>
    <path d="M1228 199 h18 M1237 190 v18" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="1280" y="194" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Source material</text>
    <text x="1280" y="219" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Docs · Drive · Gmail · meetings</text>

    <rect x="1190" y="295" width="300" height="110" rx="20" fill="#fff" opacity=".97"/>
    <rect x="1215" y="322" width="44" height="44" rx="10" fill="#ede9fe"/>
    <path d="M1228 345 l10 10 17-22" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1280" y="339" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Human review</text>
    <text x="1280" y="364" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Facts · brand · accessibility</text>

    <rect x="1190" y="440" width="300" height="110" rx="20" fill="#fff" opacity=".97"/>
    <rect x="1215" y="467" width="44" height="44" rx="10" fill="#ffe4e6"/>
    <path d="M1227 489 h20 M1227 499 h15" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
    <text x="1280" y="484" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Publish</text>
    <text x="1280" y="509" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">Approved final export</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M1105 300 C1160 270 1160 220 1190 205"/>
    <path d="M1105 390 C1160 370 1160 350 1190 350"/>
    <path d="M1105 480 C1160 485 1160 500 1190 495"/>
  </g>

  <!-- title -->
  <g transform="translate(90 715)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#fff">Canva AI 2.0</text>
    <text x="0" y="48" font-family="system-ui,sans-serif" font-size="23" fill="#cbd5e1">From conversational brief to editable, verified design</text>
  </g>
</svg>