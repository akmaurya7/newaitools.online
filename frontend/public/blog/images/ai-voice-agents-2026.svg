</g>
<g stroke="#3b82f6" stroke-width="7" stroke-linecap="round" opacity=".9">
  <path d="M390 350v-30M415 365v-60M440 350v-30M465 370v-70M490 350v-30M515 365v-60"/>
</g>
<g stroke="#10b981" stroke-width="7" stroke-linecap="round" opacity=".9">
  <path d="M1085 350v-30M1110 365v-60M1135 350v-30M1160 370v-70M1185 350v-30M1210 365v-60"/>
</g>
<g filter="url(#shadow)">
