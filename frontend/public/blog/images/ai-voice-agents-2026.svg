<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI voice agent workflow</title>
<desc id="desc">Editorial illustration of a person speaking to an AI voice agent connected to business tools, with low latency, security, and human handoff.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f5fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
  <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1330" cy="150" r="180" fill="#dbeafe" opacity=".35"/>
<circle cx="250" cy="680" r="210" fill="#dcfce7" opacity=".28"/>
