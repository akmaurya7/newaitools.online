  <text x="1390" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17325c">RESPOND</text>
</g>
<g stroke="#8b5cf6" stroke-width="4" stroke-dasharray="12 12" fill="none">
  <path d="M800 480 C800 555 360 530 360 625"/>
  <path d="M800 480 C800 555 600 530 600 625"/>
  <path d="M800 480 C800 555 1000 530 1000 625"/>
  <path d="M800 480 C800 555 1240 530 1240 625"/>
</g>
