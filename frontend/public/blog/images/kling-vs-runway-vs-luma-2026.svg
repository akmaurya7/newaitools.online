<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kling AI vs Runway Gen-3 vs Luma Dream Machine: 2026 AI Video Benchmark</title>
  <desc id="desc">Technical architectural comparison comparing Kling AI, Runway Gen-3 Alpha, and Luma Dream Machine across physical coherence, credit burndown, and camera choreography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#140f26"/>
    </linearGradient>
    <linearGradient id="klingCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1c36"/>
      <stop offset="100%" stop-color="#0c0e1e"/>
    </linearGradient>
    <linearGradient id="runwayCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241432"/>
      <stop offset="100%" stop-color="#110a1c"/>
    </linearGradient>
    <linearGradient id="lumaCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112538"/>
      <stop offset="100%" stop-color="#081421"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="180" r="280" fill="#6366f1" opacity="0.08"/>
  <circle cx="800" cy="140" r="260" fill="#d946ef" opacity="0.07"/>
  <circle cx="1360" cy="200" r="300" fill="#0284c7" opacity="0.08"/>

  <text x="80" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Kling AI vs Runway Gen-3 vs Luma Dream Machine</text>
  <text x="80" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">The 2026 Generative AI Video Shootout: Motion Physics, Credit Burndown &amp; Cinematic Control</text>

  <!-- Left: Kling AI Card -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="195" width="445" height="570" rx="20" fill="url(#klingCard)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="115" y="230" width="105" height="30" rx="8" fill="#6366f1" fill-opacity="0.25"/>
    <text x="167" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle">KLING AI</text>
    <text x="115" y="295" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Physics &amp; Trajectory King</text>
    <text x="115" y="322" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">3D Spatio-Temporal DiT + 3D VAE</text>

    <rect x="115" y="350" width="375" height="84" rx="12" fill="#090b16" stroke="#312e81" stroke-width="1.2"/>
    <circle cx="140" cy="378" r="6" fill="#818cf8"/>
    <text x="160" y="383" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">6-Trajectory Motion Brush</text>
    <text x="160" y="408" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Isolate 6 independent moving masks</text>

    <rect x="115" y="446" width="375" height="84" rx="12" fill="#090b16" stroke="#312e81" stroke-width="1.2"/>
    <circle cx="140" cy="474" r="6" fill="#6366f1"/>
    <text x="160" y="479" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Dual-Anchor Start/End Frame</text>
    <text x="160" y="504" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Stops object drift &amp; rubber limbs</text>

    <rect x="115" y="542" width="375" height="84" rx="12" fill="#090b16" stroke="#312e81" stroke-width="1.2"/>
    <circle cx="140" cy="570" r="6" fill="#4f46e5"/>
    <text x="160" y="575" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Credit Burndown</text>
    <text x="160" y="600" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">10 credits (Std) / 35 credits (Pro 1080p)</text>

    <rect x="115" y="642" width="375" height="42" rx="10" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
    <text x="302" y="668" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" text-anchor="middle">Best For: Complex Physics &amp; Precision Masking</text>
  </g>

  <!-- Center: Runway Gen-3 Card -->
  <g filter="url(#cardShadow)">
    <rect x="577" y="195" width="445" height="570" rx="20" fill="url(#runwayCard)" stroke="#d946ef" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="612" y="230" width="135" height="30" rx="8" fill="#d946ef" fill-opacity="0.25"/>
    <text x="679" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f5d0fe" text-anchor="middle">RUNWAY GEN-3</text>
    <text x="612" y="295" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">The Hollywood Suite</text>
    <text x="612" y="322" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Gen-3 Alpha &amp; Aleph 2.0 Inpainting</text>

    <rect x="612" y="350" width="375" height="84" rx="12" fill="#120817" stroke="#701a75" stroke-width="1.2"/>
    <circle cx="637" cy="378" r="6" fill="#e879f9"/>
    <text x="657" y="383" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Director Camera Control</text>
    <text x="657" y="408" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Pan, Tilt, Dolly, Roll with fixed lens math</text>

    <rect x="612" y="446" width="375" height="84" rx="12" fill="#120817" stroke="#701a75" stroke-width="1.2"/>
    <circle cx="637" cy="474" r="6" fill="#c026d3"/>
    <text x="657" y="479" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Aleph 2.0 Inpainting</text>
    <text x="657" y="504" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Targeted object swap inside video timeline</text>

    <rect x="612" y="542" width="375" height="84" rx="12" fill="#120817" stroke="#701a75" stroke-width="1.2"/>
    <circle cx="637" cy="570" r="6" fill="#a21caf"/>
    <text x="657" y="575" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Credit Burndown</text>
    <text x="657" y="600" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">25 cr (Turbo) / 50-60 cr (Gen-3 Alpha / 5s)</text>

    <rect x="612" y="642" width="375" height="42" rx="10" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-opacity="0.3" stroke-width="1"/>
    <text x="799" y="668" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5d0fe" text-anchor="middle">Best For: Studio VFX &amp; Post-Production Editing</text>
  </g>

  <!-- Right: Luma Dream Machine Card -->
  <g filter="url(#cardShadow)">
    <rect x="1075" y="195" width="445" height="570" rx="20" fill="url(#lumaCard)" stroke="#0284c7" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="1110" y="230" width="165" height="30" rx="8" fill="#0284c7" fill-opacity="0.25"/>
    <text x="1192" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc" text-anchor="middle">LUMA DREAM MACHINE</text>
    <text x="1110" y="295" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Kinetic Camera Maestro</text>
    <text x="1110" y="322" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Ray 1 &amp; Ray 2 Volumetric Spatio-Temporal</text>

    <rect x="1110" y="350" width="375" height="84" rx="12" fill="#07121c" stroke="#075985" stroke-width="1.2"/>
    <circle cx="1135" cy="378" r="6" fill="#38bdf8"/>
    <text x="1155" y="383" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Sweeping Camera Presets</text>
    <text x="1155" y="408" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Orbit, Dolly, Crane, Zoom with HDR lighting</text>

    <rect x="1110" y="446" width="375" height="84" rx="12" fill="#07121c" stroke="#075985" stroke-width="1.2"/>
    <circle cx="1135" cy="474" r="6" fill="#0284c7"/>
    <text x="1155" y="479" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Dual Keyframe Morphing</text>
    <text x="1155" y="504" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Start and End image interpolation</text>

    <rect x="1110" y="542" width="375" height="84" rx="12" fill="#07121c" stroke="#075985" stroke-width="1.2"/>
    <circle cx="1135" cy="570" r="6" fill="#0369a1"/>
    <text x="1155" y="575" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Plan Allocation</text>
    <text x="1155" y="600" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">30 free/mo queue; Lite 70/mo ($9.99); Std 150/mo</text>

    <rect x="1110" y="642" width="375" height="42" rx="10" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
    <text x="1297" y="668" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="middle">Best For: 3D Cinematography &amp; Fluid Worldbuilding</text>
  </g>

  <!-- Bottom benchmark footer -->
  <rect x="80" y="790" width="1440" height="65" rx="14" fill="#0a0f1d" stroke="#334155" stroke-width="1"/>
  <text x="110" y="830" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">2026 Production Benchmark:</text>
  <text x="350" y="830" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Kling AI leads physical coherence and multi-point motion masking; Runway leads timeline VFX and inpainting; Luma leads continuous 3D camera kinetics.</text>
</svg>
